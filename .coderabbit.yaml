# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for claude-code-multi-accounts.
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit

language: "en-US"

tone_instructions: >-
  Be concrete and evidence-based. This CLI moves real OAuth credentials between
  files, so prioritise correctness and credential safety over style opinions.
  Skip nitpicks that do not change behaviour.

early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  estimate_code_review_effort: true
  poem: false

  path_filters:
    - "!**/*.bak"
    - "!**/package-lock.json"

  path_instructions:
    - path: "lib/**/*.cjs"
      instructions: >-
        Zero-dependency CommonJS: only Node built-in modules may be required —
        flag any new external dependency.
        NEVER allow an access token or refresh token value to reach stdout, an
        error message, or a thrown error's text (including JSON.parse errors on
        .credentials.json, which quote file content).
        Layer rules: lib/auth/guard.cjs must stay pure (no imports at all, clock
        injected as an argument); lib/auth/refresh.cjs may use node:https only
        and must never touch the filesystem; lib/store/io.cjs owns all writes.

    - path: "lib/auth/refresh.cjs"
      instructions: >-
        Claude Code's OAuth refresh tokens are single-use and rotate on every
        refresh; the server revokes the superseded token immediately. A rotated
        token must therefore never be dropped, and a token that already failed
        with 400/401 (invalid_grant) must never be retried.
        The token endpoint must stay HTTPS with the documented endpoint order
        (platform.claude.com first, api.anthropic.com as fallback), must not send
        the anthropic-beta header, and must preserve refreshTokenExpiresAt,
        scopes, subscriptionType and rateLimitTier from the stored blob because
        the refresh response does not return them.

    - path: "lib/actions/switch-pipeline.cjs"
      instructions: >-
        Stage order is load-bearing and must not be reordered: session check →
        expiry assessment → refresh (only when needed) → writeStore → writeLive →
        verifyLiveState. The store write must stay BEFORE the live write so a
        rotated single-use refresh token is never lost when the live write fails.
        Every abort path must leave the live files byte-identical, and the
        function must never report a switch as successful unless verification
        passed.

    - path: "lib/store/io.cjs"
      instructions: >-
        Writes to live credential files must be atomic (temp + rename) and must
        preserve the target's existing POSIX mode (0600 on .credentials.json).
        .credentials.json must be merge-written — replace only claudeAiOauth and
        keep sibling keys Claude Code may add (e.g. mcpOAuth).
        Backup retention is per source file: a global keep-N would let one file's
        backups evict another's within a single switch.

    - path: "lib/store/lock.cjs"
      instructions: >-
        The lock guards read-modify-write of credential state across processes.
        Check that acquisition stays atomic (mkdir), that the lock is always
        released on throw, and that stale-lock takeover cannot discard a lock a
        live process still holds.

    - path: "lib/actions/watcher.cjs"
      instructions: >-
        This spawns a detached background process. Verify it cannot spawn
        duplicates, always terminates (cancel, timeout, and applied paths all
        clear the watcher record), re-reads the staged record after sleeping so a
        cancel during the wait is honoured, and never applies a switch while a
        Claude Code session is still running.

    - path: "install.cjs"
      instructions: >-
        Every module under lib/ that cc-switch.cjs requires must also be copied
        here and listed in package.json "files" — a missing file makes fresh
        installs crash at require time.
        PATH edits must be user-scope (HKCU), idempotent, must preserve existing
        entries, and must be undone by uninstall.cjs.

    - path: "uninstall.cjs"
      instructions: >-
        Uninstall must reverse exactly what install.cjs added (launchers, hooks,
        statusline, PATH entry) and must not delete user data such as the account
        store or backups.

    - path: "tests/**/*.test.cjs"
      instructions: >-
        Tests use the Node built-in runner (node:test) — no external test
        framework. Tests must never touch real user state: pin HOME/USERPROFILE
        to a temp dir and CC_SWITCH_SESSION_COUNT so results do not depend on
        whether Claude Code happens to be running. Fixtures must use fake token
        strings only.

    - path: "docs/**/*.md"
      instructions: >-
        PDCA documents (plan/design/analysis/report). Check that the design
        matches what was actually implemented and flag stale claims; do not
        comment on prose style.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "main"

  tools:
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    # No ESLint/Biome config in this repo — running them would only add noise.
    eslint:
      enabled: false
    biome:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "local"
